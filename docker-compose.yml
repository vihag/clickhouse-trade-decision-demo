# Local fallback stack: ClickHouse + Postgres on this machine, no cloud account needed.
# Used by `./install.sh` (no Cloud API key in .env) and `make local-up`. The passwords below are for
# throwaway local containers bound to 127.0.0.1 only; never reuse them anywhere else.
name: trade-decision-demo
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: demo
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"   # lets the demo create its read-only MCP user
    ports:
      - "127.0.0.1:${LOCAL_CH_PORT:-8123}:8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 2s
      timeout: 3s
      retries: 60
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: trade_demo
    ports:
      - "127.0.0.1:${LOCAL_PG_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d trade_demo"]
      interval: 2s
      timeout: 3s
      retries: 60
volumes:
  clickhouse-data:
  postgres-data:
